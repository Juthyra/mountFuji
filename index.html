  /* ============ base ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0a1030; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  svg.scene { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  body.holding svg.scene { cursor: grabbing; }

  /* ============ palette hooks (driven live by JS) ============ */
  .t-sky-top  { stop-color: var(--sky-top); }
  .t-sky-mid  { stop-color: var(--sky-mid); }
  .t-sky-low  { stop-color: var(--sky-low); }
  .t-fuji-a   { stop-color: var(--fuji-a); }
  .t-fuji-b   { stop-color: var(--fuji-b); }
  .t-lake-top { stop-color: var(--lake-top); }
  .t-lake-bot { stop-color: var(--lake-bot); }
  .t-glow-a   { stop-color: var(--city-glow); stop-opacity: .55; }
  .t-glow-b   { stop-color: var(--city-glow); stop-opacity: 0; }

  .f-snow    { fill: var(--snow); }
  .f-far     { fill: var(--far); }
  .f-tree    { fill: var(--tree); }
  .f-decid   { fill: var(--decid); opacity: var(--decid-op); }
  .f-shore   { fill: var(--shore); }
  .f-fg      { fill: var(--fg); }
  .f-ground  { fill: var(--ground); }
  .f-field   { fill: var(--field); opacity: var(--field-op); }
  .f-torii   { fill: var(--torii); }
  .f-branch  { fill: var(--branch); }
  .f-blossom { fill: var(--blossom); }
  .f-core    { fill: var(--blossom-core); }
  .f-leaf    { fill: var(--leaf); }
  .f-glade   { fill: var(--glade); }
  .f-wall    { fill: var(--wall); }
  .f-roof    { fill: var(--roof); }
  .f-fac-a   { fill: var(--facade-a); }
  .f-fac-b   { fill: var(--facade-b); }
  .f-fac-c   { fill: var(--facade-c); }
  .f-glass   { fill: var(--glass); }
  .f-win-dark{ fill: var(--win-dark); }
  .f-win-lit { fill: var(--win-lit); opacity: var(--win-lit-op); }
  .f-train   { fill: var(--train-body); }
  .f-pagoda  { fill: var(--pagoda); }
  .f-towerred{ fill: var(--tower-red); }
  .f-spire   { fill: var(--spire); }

  #blossoms   { opacity: var(--blossom-op); }
  #branchLeaf { opacity: var(--leaf-op); }
  #branchSnow { opacity: var(--branch-snow-op); }
  #stars      { opacity: var(--stars-op); }
  #birds      { opacity: var(--bird-op); }
  #cityGlow   { opacity: var(--city-glow-op); }
  #smokeG     { opacity: var(--smoke-op); }
  #railG      { opacity: var(--train-op); }
  #planeG     { opacity: var(--plane-op); }
  .beaconWrap { opacity: var(--beacon-op); }

  /* ============ sky objects ============ */
  .star { fill: #eaf2ff; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  #sunDisc { fill: var(--sun-fill);
    filter: drop-shadow(0 0 34px var(--sun-glow)) drop-shadow(0 0 90px var(--sun-glow)); }
  #moonDisc { filter: drop-shadow(0 0 26px rgba(205,225,255,.65)); }
  #glade { opacity: var(--glade-op); animation: gladeShimmer 5s ease-in-out infinite; }
  @keyframes gladeShimmer { 0%,100% { opacity: calc(var(--glade-op) * .7); } 50% { opacity: var(--glade-op); } }

  /* ============ clouds & birds ============ */
  .cloud { animation: drift linear infinite; }
  .puff  { fill: var(--cloud); opacity: var(--cloud-op); }
  @keyframes drift { from { transform: translateX(-420px); } to { transform: translateX(2020px); } }
  .birdFlight { animation: fly 44s linear infinite; }
  .birdBob { animation: bob 3.2s ease-in-out infinite alternate; }
  .bird { fill: none; stroke: var(--fg); stroke-width: 3.4; stroke-linecap: round;
          transform-box: fill-box; transform-origin: center;
          animation: flap .5s ease-in-out infinite alternate; }
  @keyframes fly  { from { transform: translateX(-160px); } to { transform: translateX(1820px); } }
  @keyframes bob  { from { transform: translateY(0); } to { transform: translateY(-26px); } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }

  /* ============ city life ============ */
  .beacon { fill: #ff5a4e; animation: blink 2.2s steps(1) infinite; }
  .beacon.white { fill: #ffffff; animation-duration: 1.4s; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: .06; } }
  .craneJib { transform-box: fill-box; transform-origin: 18% 50%;
              animation: craneTurn 14s ease-in-out infinite alternate; }
  @keyframes craneTurn { from { transform: rotate(-7deg); } to { transform: rotate(8deg); } }
  #train { animation: trainRun 9s linear infinite; }
  @keyframes trainRun { 0% { transform: translateX(-200px); } 55% { transform: translateX(1800px); } 100% { transform: translateX(1800px); } }
  #plane { animation: planeRun 30s linear infinite; }
  @keyframes planeRun { 0% { transform: translateX(-160px); } 42% { transform: translateX(1800px); } 100% { transform: translateX(1800px); } }
  .smokePuff { fill: #cfd4dd; transform-box: fill-box; transform-origin: center;
               animation: smokeRise 4.5s ease-out infinite; }
  @keyframes smokeRise {
    0%   { transform: translate(0,0) scale(.5); opacity: .55; }
    100% { transform: translate(9px,-38px) scale(1.9); opacity: 0; }
  }

  /* ============ water & mist ============ */
  .shimmer { fill: #ffffff; animation: shimmer 4s ease-in-out infinite; }
  @keyframes shimmer { 0%,100% { opacity:.04; } 50% { opacity:.16; } }
  .ripple { fill: none; stroke: #ffffff; stroke-width: 1.6; opacity: 0;
            transform-box: fill-box; transform-origin: center;
            animation: ripple 6s ease-out infinite; }
  @keyframes ripple { 0% { transform: scale(.2); opacity:.5; } 70% { opacity:.12; } 100% { transform: scale(1.6); opacity:0; } }
  .mist { fill: #ffffff; opacity: var(--mist-op); filter: url(#soft); }
  .mistA { animation: mistDrift 26s ease-in-out infinite alternate; }
  .mistB { animation: mistDrift 34s ease-in-out infinite alternate-reverse; }
  @keyframes mistDrift { from { transform: translateX(-46px); } to { transform: translateX(46px); } }
  #boat { animation: boatBob 4.5s ease-in-out infinite alternate; }
  @keyframes boatBob { from { transform: translateY(0); } to { transform: translateY(4px); } }
  .reed { stroke: var(--fg); fill: none; stroke-linecap: round;
          transform-box: fill-box; transform-origin: bottom center;
          animation: sway 4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.6deg); } }

  /* ============ particles overlay ============ */
  #fx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
  .petalWrap { position: absolute; top: 0; left: 0; will-change: transform;
               animation: petalFall var(--d) linear forwards; }
  .petal {
    width: var(--sz); height: calc(var(--sz) * .82);
    background: radial-gradient(circle at 30% 30%, #ffe9f1, #ffb9cf 65%, #f792b4);
    border-radius: 100% 4% 100% 4%;
    animation: petalSpin var(--s) ease-in-out infinite alternate;
  }
  .petal.maple {
    background: radial-gradient(circle at 30% 30%, #ffc98a, #ff9a3d 55%, #d9542b);
    border-radius: 80% 6% 80% 6%;
  }
  .petal.flake {
    background: radial-gradient(circle at 35% 35%, #ffffff, #e8f1fb 60%, rgba(207,223,242,0));
    border-radius: 50%;
  }
  @keyframes petalFall {
    from { transform: translate3d(var(--x0), -6vh, 0); }
    to   { transform: translate3d(var(--x1), 106vh, 0); }
  }
  @keyframes petalSpin {
    from { transform: rotate(-40deg) rotateY(0deg)   translateX(-14px); }
    to   { transform: rotate(70deg)  rotateY(160deg) translateX(14px); }
  }
  .flyWrap { position: absolute; animation: flyWander var(--d) ease-in-out forwards; }
  .flyDot { width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle, #fff8c8, #d8e878 60%, rgba(180,220,90,0));
    box-shadow: 0 0 10px 3px rgba(220,240,140,.55);
    animation: flyPulse 1.6s ease-in-out infinite; }
  @keyframes flyWander {
    0%   { transform: translate(0,0); opacity: 0; }
    12%  { opacity: 1; }
    35%  { transform: translate(3vw,-4vh); }
    65%  { transform: translate(-2vw,-7vh); opacity: 1; }
    100% { transform: translate(2vw,-11vh); opacity: 0; }
  }
  @keyframes flyPulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .shot {
    position: absolute; width: 150px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
    filter: drop-shadow(0 0 6px #cfe0ff);
    animation: shot 1.3s ease-out forwards;
  }
  @keyframes shot {
    from { transform: rotate(28deg) translateX(0);     opacity: 0; }
    12%  { opacity: 1; }
    to   { transform: rotate(28deg) translateX(340px); opacity: 0; }
  }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4;
              background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(5,8,20,.32) 100%); }

  /* ============ title & HUD ============ */
  #title { position: fixed; top: 25vh; left: 40px; z-index: 10; pointer-events: none;
           color: var(--ink); }
  #title .kanji {
    font-family: "FujiSerif", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
    font-size: clamp(38px, 5.4vw, 66px); font-weight: 600; letter-spacing: .18em; line-height: 1.05;
    text-shadow: 0 2px 22px rgba(0,0,0,.18);
  }
  #title .sub {
    margin-top: 9px; font-size: clamp(10px, 1.2vw, 13px); letter-spacing: .34em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  #status { margin-top: 16px; font-size: clamp(11px, 1.2vw, 13.5px); letter-spacing: .14em;
            color: var(--ink-soft); }
  #status .row { display: flex; align-items: baseline; gap: 9px; margin-top: 5px; }
  #status .kj { font-family: "FujiSerif", "Hiragino Mincho ProN", "Yu Mincho", serif;
                font-size: 1.5em; color: var(--ink); letter-spacing: .1em; }
  #status .bar { width: 190px; height: 3px; margin-top: 10px; border-radius: 2px;
                 background: rgba(128,140,160,.35); overflow: hidden; }
  #status .bar i { display: block; height: 100%; width: 0%;
                   background: var(--ink); border-radius: 2px; }

  /* ============ controls ============ */
  #panel {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 6px; align-items: center; padding: 7px;
    background: rgba(12,17,34,.5); border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 34px rgba(0,0,0,.28);
  }
  #panel button {
    appearance: none; border: 0; cursor: pointer; border-radius: 999px;
    padding: 9px 15px; font: 600 12.5px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .08em; color: #e8edf8; background: transparent;
    transition: background .25s ease, color .25s ease, transform .15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  #panel button:hover { background: rgba(255,255,255,.16); }
  #panel button:active { transform: scale(.94); }
  #panel button[aria-pressed="true"] { background: #f4f7ff; color: #17233f; }
  #petalBtn[aria-pressed="true"] { background: #ffc2d6; color: #5c1f33; }
  #panel .sep { width: 1px; height: 22px; background: rgba(255,255,255,.22); margin: 0 3px; }
  #speedChip {
    min-width: 46px; text-align: center; padding: 9px 10px; border-radius: 999px;
    font: 700 12.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .06em;
    color: #bcd0ee; background: rgba(255,255,255,.08);
    transition: background .3s ease, color .3s ease;
  }
  body.ff #speedChip { background: #ffd76e; color: #4d3208; animation: chipPulse .8s ease-in-out infinite; }
  @keyframes chipPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }

  #ffToast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    padding: 9px 18px; border-radius: 999px; pointer-events: none;
    background: rgba(12,17,34,.55); border: 1px solid rgba(255,215,110,.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #ffd76e; font: 700 12px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .28em;
    opacity: 0; transition: opacity .35s ease;
  }
  body.ff #ffToast { opacity: 1; }

  #hint {
    position: fixed; right: 26px; bottom: 28px; z-index: 10; pointer-events: none;
    font-size: 11px; letter-spacing: .1em; color: rgba(232,238,250,.78);
    background: rgba(12,17,34,.42); border: 1px solid rgba(255,255,255,.14);
    padding: 7px 12px; border-radius: 999px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .hzm { stop-color: var(--haze); stop-opacity: .26; } .hz0 { stop-color: var(--haze); stop-opacity: .6; } .hz1 { stop-color: var(--haze); stop-opacity: 0; } .hz2 { stop-color: var(--haze); stop-opacity: .85; }
  .pedG { filter: brightness(var(--car-bright)); }
  .neonGlow { opacity: var(--neon-op); }
  .neonTxt { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif; font-weight: 800; opacity: var(--neon-txt); }
  .gateTxt { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif; font-weight: 800; }
  .kabuGate { opacity: var(--gate-op); }
  #redGlow { opacity: var(--neon-glow); mix-blend-mode: screen; }
  .f-land { fill: var(--land); }
  .f-road { fill: var(--road); }
  .f-walk { fill: var(--walk); }
  .f-shL  { fill: #0a1030; opacity: var(--shade-l); }
  .f-shR  { fill: #0a1030; opacity: var(--shade-r); }
  .laneMark { fill: #f1ead0; opacity: var(--lane-op); }
  .streetTree { opacity: var(--tree-op); }
  .streetLamp { opacity: var(--lamp-gate); }
  .lampPole { fill: none; stroke: var(--fg); stroke-linecap: round; }
  .lampGlow { fill: #ffd98a; opacity: var(--lamp-glow); }
  .carG { opacity: var(--car-op); filter: brightness(var(--car-bright)); }
  .carGlow { opacity: var(--lights-op); }
  #sunRays { opacity: var(--rays-op); transform-origin: 0 0; animation: raySpin 160s linear infinite; }
  @keyframes raySpin { to { transform: rotate(360deg); } }
  #capCloud { opacity: var(--cap-op); animation: capSway 22s ease-in-out infinite alternate; }
  @keyframes capSway { from { transform: translateX(-22px); } to { transform: translateX(26px); } }
  #fgLayer, #sakura, #clouds { will-change: transform; }
  #todSlider { width: 104px; height: 4px; accent-color: #ffd76e; cursor: pointer; margin: 0 6px; }
  #soundBtn[aria-pressed="true"] { background: #bfe7d0; color: #123a28; }
  @media (max-width: 900px) {
    #todSlider { width: 70px; }
    #hint { display: none; }
    #title { top: 18px; left: 22px; }
    #panel button { padding: 8px 11px; }
    #panel button .lbl { display: none; }
    #status .bar { width: 150px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Timelapse of a city growing, seen from its main street with Mount Fuji ahead, through the seasons">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   class="t-sky-top"/>
      <stop offset=".55" class="t-sky-mid"/>
      <stop offset="1"   class="t-sky-low"/>
    </linearGradient>
    <linearGradient id="fujiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="t-fuji-a"/>
      <stop offset="1" class="t-fuji-b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx=".5" cy="1" r="1">
      <stop offset="0" class="t-glow-a"/>
      <stop offset="1" class="t-glow-b"/>
    </radialGradient>
    <linearGradient id="litGrad" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="1220" y2="0">
      <stop id="litS0" offset="0"  stop-color="#000" stop-opacity="0"/>
      <stop id="litS1" offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop id="litS2" offset="1"  stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rayGrad" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1300">
      <stop offset="0" stop-color="#fff1cc" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff1cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="groundHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="hz0"/><stop offset=".35" class="hzm"/><stop offset="1" class="hz1"/>
    </linearGradient>
    <linearGradient id="mtnHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="hz1"/><stop offset="1" class="hz2"/>
    </linearGradient>
    <radialGradient id="neonGrad">
      <stop offset="0" stop-color="#ff4a3a" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ff2a55" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="waterDistort" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="16s" values="0.012 0.09;0.017 0.13;0.012 0.09" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="streak" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2 6"/>
    </filter>
    <mask id="moonMask">
      <circle cx="0" cy="0" r="40" fill="#fff"/>
      <circle cx="15" cy="-11" r="34" fill="#000"/>
    </mask>
    <g id="blossom">
      <circle class="f-blossom" cx="0"     cy="-8.6" r="6.4"/>
      <circle class="f-blossom" cx="8.2"   cy="-2.6" r="6.4"/>
      <circle class="f-blossom" cx="5.1"   cy="7"    r="6.4"/>
      <circle class="f-blossom" cx="-5.1"  cy="7"    r="6.4"/>
      <circle class="f-blossom" cx="-8.2"  cy="-2.6" r="6.4"/>
      <circle class="f-core" cx="0" cy="0" r="3.1"/>
    </g>
    <g id="leafCluster">
      <ellipse class="f-leaf" cx="-6" cy="-3" rx="8" ry="4.6" transform="rotate(-28 -6 -3)"/>
      <ellipse class="f-leaf" cx="6"  cy="-4" rx="8" ry="4.6" transform="rotate(22 6 -4)"/>
      <ellipse class="f-leaf" cx="0"  cy="4"  rx="8.6" ry="4.8" transform="rotate(80 0 4)"/>
    </g>
    <g id="cloudShape">
      <ellipse class="puff" cx="0"   cy="0"   rx="88" ry="26"/>
      <ellipse class="puff" cx="62"  cy="-16" rx="60" ry="22"/>
      <ellipse class="puff" cx="-64" cy="-10" rx="52" ry="18"/>
      <ellipse class="puff" cx="20"  cy="10"  rx="96" ry="20"/>
    </g>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#skyGrad)"/>
  <g id="stars"></g>
  <g id="sunG"><g id="sunRays"></g><circle id="sunDisc" cx="0" cy="0" r="52"/></g>
  <g id="moonG"><circle id="moonDisc" cx="0" cy="0" r="40" fill="#f2f5fc" mask="url(#moonMask)"/></g>

  <!-- clouds -->
  <g id="clouds">
    <g class="cloud" style="animation-duration:95s;  animation-delay:-20s;"><use href="#cloudShape" x="0" y="140"/></g>
    <g class="cloud" style="animation-duration:130s; animation-delay:-70s;"><use href="#cloudShape" x="0" y="235"/></g>
    <g class="cloud" style="animation-duration:78s;  animation-delay:-45s;"><use href="#cloudShape" x="0" y="95"/></g>
    <g class="cloud" style="animation-duration:150s; animation-delay:-110s;"><use href="#cloudShape" x="0" y="330"/></g>
    <g class="cloud" style="animation-duration:110s; animation-delay:-5s;"><use href="#cloudShape" x="0" y="415"/></g>
  </g>

  <!-- birds -->
  <g id="birds">
    <g class="birdFlight" style="animation-delay:-6s;">
      <g class="birdBob"><path class="bird" d="M0 250 q 10 -11 20 0 q 10 -11 20 0"/></g>
    </g>
    <g class="birdFlight" style="animation-delay:-22s; animation-duration:52s;">
      <g class="birdBob" style="animation-delay:-1.4s;"><path class="bird" d="M0 205 q 8 -9 16 0 q 8 -9 16 0" style="animation-delay:-.2s;"/></g>
    </g>
    <g class="birdFlight" style="animation-delay:-34s; animation-duration:47s;">
      <g class="birdBob" style="animation-delay:-2.2s;"><path class="bird" d="M0 285 q 7 -8 14 0 q 7 -8 14 0" style="animation-delay:-.35s;"/></g>
    </g>
  </g>

  <!-- airplane (megacity era) -->
  <g id="planeG"><g id="plane">
    <g transform="translate(0,118)">
      <path class="f-fg" d="M0 0 l20 0 l7 3.4 l-7 3.4 l-20 0 l-5 -3.4 Z"/>
      <path class="f-fg" d="M2 -1 l-5 -7 l4 0 l7 7 Z"/>
      <path class="f-fg" d="M10 3 l-6 8 l4 0 l8 -8 Z"/>
      <g class="beaconWrap"><circle class="beacon white" cx="24" cy="3" r="2"/></g>
    </g>
  </g></g>

  <!-- mountains (reflected with ripple distortion) -->
  <g id="peaks" transform="translate(0,-30)">
    <path class="f-far" opacity=".8" d="M0 620 L0 556 Q 120 498 262 552 Q 335 584 430 620 Z"/>
    <path class="f-far" opacity=".8" d="M1600 620 L1600 542 Q 1478 492 1356 548 Q 1276 584 1170 620 Z"/>
    <path class="f-far" opacity=".55" d="M180 620 Q 330 560 470 596 Q 540 612 620 620 Z"/>
    <path class="f-far" opacity=".55" d="M1010 620 Q 1120 572 1260 600 Q 1330 612 1420 620 Z"/>
    <path id="fujiBody" fill="url(#fujiGrad)" d=""/>
    <path id="fujiShade" fill="#000" opacity=".08" d=""/>
    <path id="fujiRidges" fill="none" stroke="#1c2c4e" stroke-width="2.2" stroke-linecap="round" opacity=".15" d=""/>
    <path id="fujiSnow" class="f-snow" d=""/>
    <path id="snowDrips" class="f-snow" d=""/>
    <path id="fujiLit" fill="url(#litGrad)" d=""/>
    <g id="treeline"></g>
  </g>

  <!-- lenticular cap cloud around the summit -->
  <g id="capCloud" transform="translate(0,-30)">
    <ellipse class="puff" cx="800" cy="246" rx="150" ry="8"/>
    <ellipse class="puff" cx="806" cy="234" rx="108" ry="6.5"/>
    <ellipse class="puff" cx="796" cy="259" rx="196" ry="7"/>
  </g>

  <rect x="0" y="470" width="1600" height="124" fill="url(#mtnHaze)"/>

  <!-- mist behind the city -->
  <ellipse class="mist mistA" cx="700"  cy="612" rx="560" ry="14"/>
  <ellipse class="mist mistB" cx="1050" cy="600" rx="380" ry="10"/>

  <!-- night light-pollution dome over the city -->
  <ellipse id="cityGlow" cx="800" cy="592" rx="600" ry="130" fill="url(#glowGrad)"/>

  <!-- the growing city (reflected with light streaks) -->
  <g id="cityAll" transform="translate(0,-26)">
    <rect id="cityGround" class="f-ground" x="0" y="611" width="1600" height="9" opacity="0"/>
    <g id="fields"></g>
    <g id="cityBack" opacity=".78"></g>
    <g id="cityFront"></g>
    <g id="landmarks"></g>
    <g id="cranes"></g>
    <g id="smokeG"></g>
    <g id="railG">
      <g id="viaduct"></g>
      <g id="train"></g>
    </g>
  </g>

  <!-- the street you are standing in -->
  <g id="fgLayer">
    <rect class="f-land" x="-90" y="590" width="1780" height="330"/>
    <g id="roadG"></g>
<rect x="-90" y="586" width="1780" height="230" fill="url(#groundHaze)"/>
    <g id="carsG"></g>
    <g id="streetItems"></g>
    <g id="pedsG"></g>
  </g>

</svg>

<div id="vignette"></div>
<div id="fx"></div>

<header id="title">
  <div class="kanji">富士山</div>
  <div class="sub">Mount Fuji · Tokyo, looking west</div>
  <div id="status">
    <div class="row"><span class="kj" id="seasonKj">春</span><span id="seasonName">Spring</span><span>·</span><span id="yearLabel">Year 1</span></div>
    <div class="row"><span class="kj" id="eraKj">村</span><span id="eraName">Village</span></div>
    <div class="bar"><i id="eraBar"></i></div>
  </div>
</header>

<div id="ffToast">▶▶ FAST FORWARD</div>

<nav id="panel" aria-label="Timelapse controls">
  <button id="restartBtn" title="Restart timelapse (R)">
    <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5V1L6 7l6 6V9c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
    <span class="lbl">Restart</span>
  </button>
  <button id="playBtn" aria-pressed="false" title="Pause / play (Space)">
    <svg id="icoPause" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    <svg id="icoPlay" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path fill="currentColor" d="M6 4l14 8-14 8z"/></svg>
    <span class="lbl" id="playLabel">Pause</span>
  </button>
  <button id="petalBtn" aria-pressed="true" title="Toggle seasonal particles (P)">
    <svg width="14" height="14" viewBox="-12 -12 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="0" cy="-7" r="4.8"/><circle cx="6.7" cy="-2.2" r="4.8"/><circle cx="4.1" cy="5.7" r="4.8"/><circle cx="-4.1" cy="5.7" r="4.8"/><circle cx="-6.7" cy="-2.2" r="4.8"/></g><circle cx="0" cy="0" r="2.5" fill="rgba(0,0,0,.28)"/></svg>
    <span class="lbl">Particles</span>
  </button>
  <button id="soundBtn" aria-pressed="false" title="Ambient sound (M)">
    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <span class="lbl">Sound</span>
  </button>
  <span class="sep"></span>
  <input id="todSlider" type="range" min="0" max="1000" value="320" title="Scrub time of day" aria-label="Time of day">
  <span class="sep"></span>
  <span id="speedChip" title="Timelapse speed — hold anywhere to fast-forward">1×</span>
</nav>

<div id="hint">Hold anywhere to fast-forward · Space pause · R restart · M sound · drag the slider to scrub time</div>

<script>
(function () {
  "use strict";
  /* ================= utilities ================= */
  var svgNS = "http://www.w3.org/2000/svg";
  var root = document.documentElement, body = document.body;
  var fx = document.getElementById("fx");

  function startAudio() {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    audio = auBuild(new AC()); audio.L = null;
  }
  function updateAudio(w, nf) {
    var t = audio.c.currentTime, on = soundOn && !paused;
    audio.out.gain.setTargetAtTime(on ? .9 : 0, t, .3);
    audio.L = auLevels(auSnapshot(w, nf));
    auApply(audio, audio.L, t, .6, false);
  }
  setInterval(function () {
    if (!audio || !audio.L || !soundOn || paused || speed > 3 || audio.c.state !== "running") return;
    auEvents(audio, audio.L, audio.c.currentTime + .05);
  }, 400);
  // offline render for tests: returns RMS / peak in dBFS for a given growth, night factor and season
  function auRender(g, nf, w, secs) {
    var OAC = window.OfflineAudioContext, sr = 32000, c = new OAC(1, sr * secs, sr), A = auBuild(c);
    var L = auLevels({ g: g, nf: nf, w: w, fast: false, craneAct: auCrane(g), trainQ: .5, planeQ: .5 });
    auApply(A, L, 0, 0, true);
    for (var t = 0; t < secs; t += .4) auEvents(A, L, t + .05);
    return c.startRendering().then(function (buf) {
      var d = buf.getChannelData(0), s2 = 0, pk = 0, off = Math.floor(d.length * .25);
      for (var i = off; i < d.length; i++) { s2 += d[i] * d[i]; pk = Math.max(pk, Math.abs(d[i])); }
      return { rmsDb: +(10 * Math.log10(s2 / (d.length - off) + 1e-12)).toFixed(1), peakDb: +(20 * Math.log10(pk + 1e-9)).toFixed(1) };
    });
  }
  var soundBtn = document.getElementById("soundBtn");
  function toggleSound() {
    soundOn = !soundOn;
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) { if (!audio) startAudio(); if (audio && audio.c.state === "suspended") audio.c.resume(); }
  }
  soundBtn.addEventListener("click", toggleSound);

  // time-of-day scrubber + mouse parallax
  todSlider.addEventListener("pointerdown", function (e) { e.stopPropagation(); scrubbing = true; });
  todSlider.addEventListener("input", function () { dayAcc = todSlider.value / 1000; });
  window.addEventListener("pointerup", function () { scrubbing = false; });
  window.addEventListener("pointermove", function (e) {
    pxT = (e.clientX / innerWidth - .5) * 2; pyT = (e.clientY / innerHeight - .5) * 2;
  });

  /* ================= controls ================= */
  var playBtn = document.getElementById("playBtn");
  var icoPlay = document.getElementById("icoPlay"), icoPause = document.getElementById("icoPause");
  var playLabel = document.getElementById("playLabel");
  function setPaused(p) {
    paused = p;
    playBtn.setAttribute("aria-pressed", String(p));
    icoPlay.style.display = p ? "" : "none";
    icoPause.style.display = p ? "none" : "";
    playLabel.textContent = p ? "Play" : "Pause";
    try { p ? svg.pauseAnimations() : svg.unpauseAnimations(); } catch (e) {}
  }
  playBtn.addEventListener("click", function () { setPaused(!paused); });
  document.getElementById("restartBtn").addEventListener("click", restart);
  function restart() {
    simDays = .6; dayAcc = .32; growthApplied = -1; hudCache = "";
    fx.innerHTML = ""; particleCount = 0;
    acc.petal = acc.maple = acc.flake = acc.fly = 0;
    setPaused(false);
  }
  var petalBtn = document.getElementById("petalBtn");
  petalBtn.setAttribute("aria-pressed", String(petalsOn));
  petalBtn.addEventListener("click", function () {
    petalsOn = !petalsOn;
    petalBtn.setAttribute("aria-pressed", String(petalsOn));
  });

  // press & hold anywhere (except the control panel) to fast-forward
  window.addEventListener("pointerdown", function (e) {
    if (e.target.closest && e.target.closest("#panel")) return;
    if (e.button !== undefined && e.button !== 0) return;
    holding = true; body.classList.add("holding");
  });
  function release() { holding = false; body.classList.remove("holding"); }
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  window.addEventListener("blur", function () { release(); holdKey = false; });
  svg.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    if (e.key === "Shift" || e.key.toLowerCase() === "f") holdKey = true;
    else if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
    else if (e.key.toLowerCase() === "r") restart();
    else if (e.key.toLowerCase() === "p") petalBtn.click();
    else if (e.key.toLowerCase() === "m") toggleSound();
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "Shift" || e.key.toLowerCase() === "f") holdKey = false;
  });

  /* ================= debug / test hook ================= */
  window.__fuji = {
    jump: function (days, tod) { simDays = days; dayAcc = tod; growthApplied = -1; hudCache = ""; },
    pin: function (days, tod) { pinned = [days, tod]; growthApplied = -1; hudCache = ""; },
    unpin: function () { pinned = null; },
    get speed() { return speed; },
    get growth() { return growth; },
    get paused() { return paused; },
    setPaused: setPaused,
    renderAudio: auRender
  };

  /* ================= go ================= */
  buildFuji();
  buildSnow(365);
  setPaused(paused);
  applyFrame();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
